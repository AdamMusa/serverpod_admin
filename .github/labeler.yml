# Configuration for automatic labeling of pull requests.

# Labels for pull requests based on changed files
server:
  - changed-files:
      - any-glob-to-any-file: 'serverpod_admin_server/**'

dashboard:
  - changed-files:
      - any-glob-to-any-file: 'serverpod_admin_dashboard/**'

client:
  - changed-files:
      - any-glob-to-any-file: 'serverpod_admin_client/**'

example:
  - changed-files:
      - any-glob-to-any-file: 'example/**'

ci/cd:
  - changed-files:
      - any-glob-to-any-file: '.github/**'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - '**/*.md'
          - 'LICENSE'

# actions/labeler supports file and branch matching, not title/body matching.
bug:
  - head-branch: ['^fix/', '^bugfix/', '^hotfix/']

enhancement:
  - head-branch: ['^feat/', '^feature/', '^enhancement/']

refactor:
  - head-branch: ['^refactor/', '^cleanup/']

test:
  - any:
      - head-branch: ['^test/', '^tests/']
      - changed-files:
          - any-glob-to-any-file:
              - '**/*test*.dart'
              - '**/test/**'

chore:
  - head-branch: ['^chore/', '^deps/', '^dependencies/']
